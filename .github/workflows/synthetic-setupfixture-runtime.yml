name: Synthetic NUnit SetUpFixture browser behavior

on:
  pull_request:
    paths:
      - experiments/synthetic-setupfixture/**
      - .github/workflows/synthetic-setupfixture-runtime.yml
  push:
    branches: [main]
    paths:
      - experiments/synthetic-setupfixture/**
      - .github/workflows/synthetic-setupfixture-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-setupfixture-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build independent NUnit scoped fixture tests
        run: |
          dotnet restore experiments/synthetic-setupfixture/ScopedSetupFixture.Tests.csproj
          dotnet build experiments/synthetic-setupfixture/ScopedSetupFixture.Tests.csproj -c Release --no-restore
      - name: Install Chromium from matched Playwright package
        run: pwsh experiments/synthetic-setupfixture/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Execute real Chromium scoped NUnit lifecycle tests
        run: |
          mkdir -p evidence
          dotnet test experiments/synthetic-setupfixture/ScopedSetupFixture.Tests.csproj \
            -c Release --no-build --nologo \
            --results-directory evidence \
            --logger "trx;LogFileName=synthetic-setupfixture.trx"
      - name: Require three executed passing tests and no ignored cases
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as et
          root = et.parse(pathlib.Path("evidence/synthetic-setupfixture.trx")).getroot()
          counters = next(element for element in root.iter() if element.tag.endswith("Counters"))
          counts = {name: int(value) for name, value in counters.attrib.items() if value.isdigit()}
          print(counts)
          assert counts.get("total", 0) == 3, "Expected two nested and one sibling scoped NUnit browser tests"
          assert counts.get("passed", 0) == 3, "NUnit scoped lifecycle or browser expectations failed"
          assert counts.get("failed", 0) == 0 and counts.get("skipped", 0) == 0, "No silent skip allowed"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-scoped-setupfixture-browser-evidence
          path: evidence/*.trx
          retention-days: 30
          if-no-files-found: warn
