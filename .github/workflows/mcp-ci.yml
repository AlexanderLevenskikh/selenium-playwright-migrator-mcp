name: MCP CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-protocol-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Core for local NuGet feed
        uses: actions/checkout@v4
        with:
          repository: AlexanderLevenskikh/selenium-playwright-migrator-core
          ref: 41976a64ec52078b97df55ad6500d272b5350c12
          path: core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Core NuGet feed
        run: |
          mkdir -p artifacts/nuget
          for project in Migrator.Core Migrator.Roslyn Migrator.SeleniumCSharp Migrator.PlaywrightDotNet Migrator.Application; do
            dotnet pack "core/$project/$project.csproj" -c Release -o artifacts/nuget
          done
      - name: Restore MCP from packages, not ProjectReference
        run: |
          if grep -q 'ProjectReference' Migrator.Mcp/Migrator.Mcp.csproj; then
            echo 'MCP may not reference Core source projects' >&2
            exit 1
          fi
          dotnet restore Migrator.Mcp/Migrator.Mcp.csproj --source "$PWD/artifacts/nuget" --source https://api.nuget.org/v3/index.json
      - name: Build MCP independently of Core source paths
        run: dotnet build Migrator.Mcp/Migrator.Mcp.csproj --no-restore -c Release
      - name: Real MCP stdio protocol smoke
        run: python3 scripts/mcp_stdio_smoke.py Migrator.Mcp/bin/Release/net10.0/Migrator.Mcp.dll
      - name: Mapped Loader and table assertions stdio regression
        run: python3 scripts/mapped_table_loader_smoke.py Migrator.Mcp/bin/Release/net10.0/Migrator.Mcp.dll
      - name: Review source-backed POM mappings over stdio
        run: python3 scripts/pom_mapping_review_smoke.py Migrator.Mcp/bin/Release/net10.0/Migrator.Mcp.dll

      - name: Pack MCP as a versioned dotnet tool
        run: |
          mkdir -p artifacts/mcp
          dotnet pack Migrator.Mcp/Migrator.Mcp.csproj --no-restore -c Release -o artifacts/mcp
      - name: Install packaged tool from local NuGet feed
        run: |
          dotnet tool install SeleniumPlaywrightMigrator.Mcp --version 0.1.0-preview.11 --tool-path "$PWD/artifacts/tool" --add-source "$PWD/artifacts/mcp" --add-source "$PWD/artifacts/nuget" --add-source https://api.nuget.org/v3/index.json
      - name: Exercise installed MCP tool over stdio
        run: python3 scripts/mcp_stdio_smoke.py artifacts/tool/selenium-pw-migrator-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-playwright-migrator-mcp-preview-tool
          path: artifacts/mcp/*.nupkg
          if-no-files-found: error

      - name: Restore runtime-specific Linux x64 tool dependencies
        run: dotnet restore Migrator.Mcp/Migrator.Mcp.csproj -r linux-x64 --source "$PWD/artifacts/nuget" --source https://api.nuget.org/v3/index.json
      - name: Publish self-contained Linux x64 executable
        run: |
          dotnet publish Migrator.Mcp/Migrator.Mcp.csproj -c Release -r linux-x64 --self-contained true --no-restore -p:PublishSingleFile=false -p:PublishTrimmed=false -o artifacts/standalone/linux-x64
          test -x artifacts/standalone/linux-x64/Migrator.Mcp
      - name: Protocol smoke against self-contained Linux executable
        run: python3 scripts/mcp_stdio_smoke.py artifacts/standalone/linux-x64/Migrator.Mcp
      - name: Create Linux distribution archive
        run: tar -C artifacts/standalone/linux-x64 -czf artifacts/standalone/selenium-playwright-migrator-mcp-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-playwright-migrator-mcp-linux-x64
          path: artifacts/standalone/selenium-playwright-migrator-mcp-linux-x64.tar.gz
          if-no-files-found: error

  windows-standalone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Core for local NuGet feed
        uses: actions/checkout@v4
        with:
          repository: AlexanderLevenskikh/selenium-playwright-migrator-core
          ref: 41976a64ec52078b97df55ad6500d272b5350c12
          path: core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Core package feed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/nuget | Out-Null
          foreach ($project in @('Migrator.Core', 'Migrator.Roslyn', 'Migrator.SeleniumCSharp', 'Migrator.PlaywrightDotNet', 'Migrator.Application')) {
            dotnet pack "core/$project/$project.csproj" -c Release -o artifacts/nuget
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Restore runtime-specific Windows x64 tool dependencies
        shell: pwsh
        run: |
          $feed = (Resolve-Path artifacts/nuget).Path
          $config = @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@
          $config | Set-Content -Path artifacts/NuGet.Config -Encoding utf8
          dotnet restore Migrator.Mcp/Migrator.Mcp.csproj -r win-x64 --configfile artifacts/NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish Migrator.Mcp/Migrator.Mcp.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=false -p:PublishTrimmed=false -o artifacts/standalone/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path artifacts/standalone/win-x64/Migrator.Mcp.exe)) { throw 'Windows MCP executable missing' }
      - name: Protocol smoke against self-contained Windows executable
        shell: pwsh
        run: python scripts/mcp_stdio_smoke.py artifacts/standalone/win-x64/Migrator.Mcp.exe
      - name: Mapped Loader and table assertions Windows protocol
        shell: pwsh
        run: python scripts/mapped_table_loader_smoke.py artifacts/standalone/win-x64/Migrator.Mcp.exe
      - name: Review POM mapping through Windows executable
        shell: pwsh
        run: python scripts/pom_mapping_review_smoke.py artifacts/standalone/win-x64/Migrator.Mcp.exe
      - name: Archive Windows distribution
        shell: pwsh
        run: Compress-Archive -Path artifacts/standalone/win-x64/* -DestinationPath artifacts/standalone/selenium-playwright-migrator-mcp-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-playwright-migrator-mcp-win-x64
          path: artifacts/standalone/selenium-playwright-migrator-mcp-win-x64.zip
          if-no-files-found: error
